<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Marketplace UI smoke test</title>
<style>body{font:13px/1.5 ui-monospace,Consolas,monospace;padding:12px} iframe{width:1280px;height:900px;border:1px solid #ccc} .ok{color:#0a7a3d}.bad{color:#c0261b;font-weight:700}</style></head>
<body>
<p>Drives the real marketplace screens in demo mode (offline). Serve the repo root, then open <code>/tests/ui-smoke.html</code>.</p>
<pre id="out"></pre>
<iframe id="f"></iframe>
<script>
(function () {
  localStorage.removeItem('cardcrest.v1'); localStorage.removeItem('cc.mk.offset');
  var out = document.getElementById('out'), f = document.getElementById('f'), pass = 0, bad = 0, errs = [];
  function log(c, m) { var s = document.createElement('span'); s.className = c; s.textContent = m + '\n'; out.appendChild(s); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ok(c, m) { if (c) { pass++; log('ok', 'PASS  ' + m); } else { bad++; log('bad', 'FAIL  ' + m); } }
  var cw, D;
  function q(sel) { return D.querySelector(sel); }
  function txt() { return D.getElementById('view').innerText; }
  async function go(hash) { cw.location.hash = hash; await sleep(350); }
  async function until(fn, ms) { var t = Date.now(); while (Date.now() - t < (ms || 3000)) { try { if (fn()) return true; } catch (e) {} await sleep(60); } return false; }
  function set(sel, v) { var el = q(sel); el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }
  function click(sel) { var el = typeof sel === 'string' ? q(sel) : sel; el.click(); }
  function local(h) { var t = new Date(Date.now() + h * 3600000); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 16); }

  f.onload = async function () {
    try {
      cw = f.contentWindow; D = cw.document;
      cw.addEventListener('error', function (e) { errs.push(e.message); });
      var ce = cw.console.error; cw.console.error = function () { errs.push([].slice.call(arguments).join(' ')); ce.apply(cw.console, arguments); };
      await until(function () { return cw.CC && cw.CC.Router && cw.CC.Pages && cw.CC.Pages.marketRequest; }, 5000);
      ok(!!cw.CC.Pages.marketRequest, 'marketplace pages are registered');
      ok(cw.CC.Market.mode() === 'local', 'demo mode runs against the local engine');
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth();

      /* every marketplace route renders */
      var routes = ['#/market', '#/market/new/lounge', '#/market/new/movie', '#/market/new/order', '#/market/new/pay', '#/market/requests', '#/market/earn', '#/market/cards', '#/market/wallet', '#/market/r/none'];
      for (var i = 0; i < routes.length; i++) { await go(routes[i]); ok(txt().length > 40 && !/could not load/i.test(txt()), 'route renders: ' + routes[i]); }
      await go('#/'); ok(q('.hdr__nav a[href="#/market"]') !== null, 'header has a Share & Earn link');
      await go('#/market/earn'); ok(!!q('#soundBtn') && /Live alerts are on/.test(txt()), 'Earn page shows the live alerts bar with a sound switch');
      await go('#/dashboard/transactions'); ok(D.querySelectorAll('table.tbl .logo-badge--img img').length > 0 && D.querySelectorAll('table.tbl .logo-badge--img img').length === D.querySelectorAll('table.tbl tbody tr').length - D.querySelectorAll('table.tbl tbody tr.pg-hide').length, 'every transaction row shows the store logo');
      /* card applications: sent to the bank's site with Card Crest's partner code attached */
      cw.CC_CONFIG.PARTNER_REF = { default: 'CC-EMP-77' };
      var opens2 = [], card0 = cw.CC.Store.get('cards')[0];
      cw.open = function (url, name, feat) { opens2.push(url); return opens2.length === 1 ? null : { focus: function () {} }; };
      await go('#/cards/' + card0.id); click('[data-apply]');
      ok(await until(function () { return q('.modal [data-yes]'); }) && /partner code is attached/.test(q('.modal').innerText), 'Apply for this card says the bank gets Card Crest\u2019s partner code');
      click('.modal [data-yes]');
      ok(await until(function () { return /\/apply\/.*go=1/.test(cw.location.hash) && q('#shopGo'); }), 'if the window is blocked, the hand-over screen takes the tab to the bank');
      var app0 = cw.CC.Store.get('applications')[0], au = cw.CC.Applications.trackedUrl(app0);
      ok(au.indexOf('ref=CC-EMP-77') > -1 && au.indexOf('cc_click=' + app0.id) > -1 && /^https:\/\/www\./.test(au) && /credit-card/.test(au.split('?')[0]) && opens2[0] === au, 'the bank link carries the partner code and the application reference: ' + au);
      click('#goStay'); await sleep(200);
      ok(/Your application is linked to Card Crest/.test(txt()) && /CC-EMP-77/.test(txt()), 'the application page shows the partner code that is attached');
      var before = cw.CC.Store.get('applications').length;
      await go('#/cards/' + card0.id); click('[data-apply]'); await until(function () { return q('.modal [data-yes]'); }); click('.modal [data-yes]');
      ok(await until(function () { return /#\/apply\/[^?]+$/.test(cw.location.hash); }) && cw.CC.Store.get('applications').length === before, 'applying again for the same card picks up the open application, not a duplicate');
      /* pages that were replaced must stop listening, or they pile up and make the screen jitter */
      for (var k = 0; k < 6; k++) { await go('#/market/earn'); await go('#/market/requests'); }
      var calls = 0, realOpen = cw.CC.Market.openFor;
      cw.CC.Market.openFor = function () { calls++; return realOpen.apply(this, arguments); };
      cw.dispatchEvent(new cw.CustomEvent('cc:market'));
      cw.CC.Market.openFor = realOpen;
      ok(calls <= 2, 'only the page on screen reacts to a market event (' + calls + ' reactions after 12 page changes)');
      /* offers: activating opens the store in a Card Crest shopping window, or hands the tab over if the browser blocks it */
      var opens = [];
      cw.open = function (url, name, feat) { opens.push([url, name, feat]); return opens.length === 1 ? null : { focus: function () {} }; };
      await go('#/stores/flipkart');
      click('[data-activate-store]');
      ok(await until(function () { return q('.modal [data-go]'); }), 'activating a store offer asks to continue to the store');
      click('.modal [data-go]');
      ok(await until(function () { return /\/shop\/.*go=1/.test(cw.location.hash) && q('#shopGo'); }), 'if the window is blocked, a "Taking you to Flipkart" screen takes over');
      ok(/Taking you to Flipkart/.test(txt()) && !!q('#goNow') && !!q('#goTab') && !!q('#goStay'), 'it offers go now, new tab, or stay');
      var tx = cw.CC.Store.get('transactions')[0], tu = cw.CC.Cashback.trackedUrl(tx);
      ok(/flipkart\.com/.test(tu) && tu.indexOf('cc_click=' + tx.id) > -1 && opens[0][0] === tu, 'the store link carries the tracking reference: ' + tu);
      click('#goStay'); await sleep(200);
      ok(!q('#shopGo') && /Shop at Flipkart/.test(txt()) && /Cashback tracking is on/.test(txt()), 'staying shows the shopping session page');
      await go('#/stores/flipkart'); click('[data-activate-store]'); await until(function () { return q('.modal [data-go]'); }); click('.modal [data-go]');
      ok(await until(function () { return /#\/shop\/[^?]+$/.test(cw.location.hash); }) && !q('#shopGo'), 'when the window opens, Card Crest stays on the shopping session instead');
      ok(/popup=yes/.test(opens[1][2]) && opens[1][1] === 'cardcrest-store', 'the store opens in a named Card Crest shopping window');
      await sleep(13000); ok(/tracked|Tracked/.test(q('#shopStatus').innerText), 'the session follows the order live as its status moves on');

      /* lounge booking through the real form */
      await go('#/market/new/lounge');
      set('#f-airport', 'DEL'); set('#f-terminal', 'T3');
      ok(D.querySelectorAll('#f-type .chip').length === 2, 'T3 offers domestic and international');
      var domN = D.querySelectorAll('#f-airport option').length;
      ok(!!q('#f-airport option[value="PAT"]') && !q('#f-airport option[value="DXB"]'), 'domestic list is Indian airports only (Patna yes, Dubai no)');
      click('#f-type [data-t="INTERNATIONAL"]');
      ok(D.querySelectorAll('#f-airport option').length >= 250 && !q('#f-airport option[value="DEL"]') && !!q('#f-airport option[value="LHR"]') && !!q('#f-airport option[value="DXB"]'), 'choosing International lists every airport outside India');
      ok(D.querySelectorAll('#f-airport optgroup').length > 40, 'international airports are grouped by country');
      ok(q('#f-terminal').hidden && !q('#f-terminalx').hidden, 'abroad the terminal is typed in');
      click('#f-type [data-t="DOMESTIC"]'); set('#f-airport', 'DEL');
      ok(!q('#f-terminal').hidden && q('#f-terminalx').hidden && D.querySelectorAll('#f-terminal option').length === 3, 'switching back to Domestic lists the Indian terminals');
      set('#f-terminal', 'T3');
      set('#f-airport', 'DEL'); set('#f-terminal', 'T3');
      set('#f-date', local(48)); set('#f-flight', 'AI 101'); set('#f-guest', 'Ayush Kumar');
      ok(/₹500/.test(q('#mkQuote').innerText), 'domestic price shows ₹500');
      click('#f-type [data-t="INTERNATIONAL"]');
      ok(/₹1,000/.test(q('#mkQuote').innerText), 'international price shows ₹1,000');
      click('#f-type [data-t="DOMESTIC"]');
      click('#mkGo');
      ok(await until(function () { return q('.modal [data-ok]'); }), 'payment modal opens after creating the request');
      click('.modal [data-ok]');
      ok(await until(function () { return /\/market\/r\//.test(cw.location.hash); }), 'paying opens the request page');
      var reqHash = cw.location.hash;
      ok(/Open for cardholders/.test(txt()), 'request is open for cardholders after payment');

      /* test cardholder accepts and uploads proof, buyer confirms */
      click('[data-help="accept"]'); await sleep(300);
      ok(/Accepted/.test(txt()), 'test cardholder accepted');
      click('[data-help="proof"]'); await sleep(400);
      ok(/Proof uploaded/.test(txt()) && q('[data-act="confirm"]'), 'proof uploaded, buyer sees Confirm');
      ok(q('#proofs img') !== null, 'proof image is shown');
      /* chat masks contact details */
      ok(/Never share personal or contact details/.test(txt()) && /more message/.test(q('#chatLeft').innerText), 'the chat shows the disclaimer and how many messages are left');
      set('#chatIn', 'mail me at a.b@gmail.com'); q('#chatForm').dispatchEvent(new Event('submit', { cancelable: true })); await sleep(250);
      ok(/email hidden/.test(q('#chatLog').innerText) && !/gmail/.test(q('#chatLog').innerText), 'chat hides email addresses');
      set('#chatIn', 'call 98765 43210'); q('#chatIn').dispatchEvent(new Event('input', { bubbles: true }));
      ok(q('#chatIn').value.replace(/\D/g, '').length <= 4, 'the chat box stops at 4 digits: ' + q('#chatIn').value);
      click('[data-act="confirm"]'); await sleep(400);
      ok(/Completed/.test(txt()), 'confirming completes the request');
      ok(/All done/.test(txt()) && q('[data-star="5"]'), 'rating buttons appear');
      click('[data-star="5"]'); await sleep(300);
      ok(/rated this 5/.test(txt()), 'rating is saved');

      /* money boxes cannot go above the limit */
      await go('#/market/new/order');
      set('#f-list', '99999999'); ok(q('#f-list').value === '200000', 'listed price box stops at 2,00,000');
      set('#f-exp', '1234567'); ok(q('#f-exp').value === '200000', 'offer price box stops at 2,00,000');
      set('#f-exp', '12.345'); ok(q('#f-exp').value === '12.34', 'decimals are limited to 2 places');
      set('#f-list', '1000'); set('#f-exp', '1000'); ok(/less than the listed price/.test(q('#mkQuote').innerText), 'equal prices show the "must be less" message');

      /* movie with a higher final price: top-up flow */
      await go('#/market/new/movie');
      set('#f-offer', 'FLAT_500_OFF_2_SEATS'); set('#f-movie', 'Test Movie'); set('#f-theatre', 'PVR Orion'); set('#f-city', 'Bengaluru');
      set('#f-show', local(30)); set('#f-seats', 'G7, G8'); set('#f-count', '2'); set('#f-total', '1200');
      var qt = q('#mkQuote').innerText;
      ok(/₹1,000/.test(qt) && /save ₹200/i.test(qt.replace(/\s+/g, ' ')), 'movie breakdown shows pay ₹1,000 and save ₹200');
      set('#f-count', '3'); ok(/exactly 2 seats/.test(q('#mkQuote').innerText), 'three seats are refused');
      set('#f-count', '2'); click('#mkGo');
      await until(function () { return q('.modal [data-ok]'); }); click('.modal [data-ok]');
      await until(function () { return /\/market\/r\//.test(cw.location.hash); });
      click('[data-help="accept"]'); await sleep(300);
      click('[data-help="proof-high"]'); await sleep(400);
      ok(/top-up is due/i.test(txt()) && q('[data-act="topup"]') && !q('[data-act="confirm"]'), 'higher price asks for a top-up and blocks confirm');
      click('[data-act="topup"]');
      ok(await until(function () { return q('.modal [data-ok]'); }), 'top-up modal opens'); click('.modal [data-ok]');
      ok(await until(function () { return q('[data-act="confirm"]'); }), 'after top-up the buyer can confirm');
      click('[data-act="confirm"]'); await sleep(400);
      ok(/released at/i.test(txt()) || /Confirmed/.test(txt()), 'movie waits for the show before release');
      click('[data-help="t72"]'); await sleep(500);
      ok(/Completed/.test(txt()), 'moving the clock past the show settles it');

      /* cardholder side: add a card, see wallet */
      await go('#/market/cards'); click('#addCard'); await sleep(200);
      set('#c-bank', 'hdfc'); set('#c-var', 'Regalia');
      D.querySelector('.mk-ben[data-kind="LOUNGE_DOM"] [data-on]').click();
      click('.modal [data-save]'); await sleep(300);
      if (cw.location.hash !== '#/market/cards') await go('#/market/cards');   // a card added while requests are waiting jumps to the open requests
      ok(/Regalia/.test(txt()), 'a benefit card can be added');
      await go('#/market/wallet'); ok(/Withdraw money/.test(txt()) && /KYC/.test(txt()), 'wallet page shows one withdraw panel and KYC');

      /* admin sections */
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      var adm = ['market', 'mk-disputes', 'mk-kyc', 'mk-fees', 'mk-payouts', 'mk-reports'];
      for (var j = 0; j < adm.length; j++) { await go('#/admin/' + adm[j]); ok(txt().length > 60 && !/could not load/i.test(txt()), 'admin section renders: ' + adm[j]); }
      await go('#/admin/mk-reports'); ok(/Balanced/.test(txt()) && /Escrow matches/.test(txt()), 'ledger health is balanced and escrow matches');
      ok(/Requests by status/.test(txt()) && /Top cardholders/.test(txt()) && /Top buyers/.test(txt()) && /Latest ledger entries/.test(txt()) && /Lounge · Domestic/.test(txt()), 'the Revenue page fills out with status, revenue, top people and the latest ledger entries');
      await go('#/admin/mk-fees'); ok(/Domestic lounge/.test(txt()) && /Buy one get one/.test(txt()), 'fee config lists every option');
      /* staff tools: attention queue, reward approvals, transactions, announcements, activity log */
      await go('#/admin');
      ok(!!q('.adm-queue') && /Cashback to confirm/.test(txt()) && /Redemption requests/.test(txt()), 'admin overview shows the attention queue');
      ok(/Reward approvals/.test(q('.adm-nav').innerText) && /Announcements/.test(q('.adm-nav').innerText) && /Activity log/.test(q('.adm-nav').innerText), 'admin menu has Reward approvals, Announcements and Activity log');
      await go('#/admin/approvals');
      var before = cw.CC.Store.get('transactions').filter(function (t) { return ['clicked', 'tracked', 'pending'].indexOf(t.status) > -1; });
      ok(before.length > 0 && !!q('[data-cb="confirmed"]'), 'reward approvals lists cashback waiting for confirmation');
      var first = q('[data-cb="confirmed"]'), firstId = first.dataset.id, owner = cw.CC.Store.find('transactions', firstId).userId;
      click(first); await sleep(300);
      ok(cw.CC.Store.find('transactions', firstId).status === 'confirmed', 'confirming a cashback marks it confirmed');
      ok(cw.CC.Store.get('notifications').some(function (n) { return n.userId === owner && n.title === 'Cashback confirmed'; }), 'the member is told their cashback was confirmed');
      await go('#/admin/approvals');
      if (q('#pickAll')) { click('#pickAll'); click('#confirmPicked'); await until(function () { return q('.modal [data-yes]'); }); click('.modal [data-yes]'); await sleep(300); }
      ok(cw.CC.Store.get('transactions').every(function (t) { return ['clicked', 'tracked', 'pending'].indexOf(t.status) < 0; }), 'bulk confirm clears the whole queue');
      await go('#/admin/transactions');
      ok(!!q('[data-chip="confirmed"]') && !!q('[data-export="transactions"]') && /total transactions/i.test(txt()), 'transactions show totals, status filters and an export button');
      click('[data-chip="confirmed"]'); await sleep(100);
      ok([].slice.call(D.querySelectorAll('tbody tr')).every(function (tr) { var s = tr.querySelector('select[data-txn]'); return !s || tr.style.display === 'none' || s.value === 'confirmed'; }), 'the Confirmed filter hides every other status');
      await go('#/admin/announce');
      set('#an-title', 'Share & Earn is live'); set('#an-body', 'Earn from your cards or get benefits you do not have.');
      click('#an-send'); ok(await until(function () { return q('.modal [data-yes]'); }), 'sending an announcement asks to confirm'); click('.modal [data-yes]'); await sleep(300);
      ok(cw.CC.Store.get('notifications').some(function (n) { return n.userId === 'u-001' && n.title === 'Share & Earn is live'; }), 'the announcement lands in members\u2019 notifications');
      await go('#/admin/activity');
      ok(/Announcement/.test(txt()) && /Cashback/.test(txt()), 'the activity log records what staff did');
      /* Apply & Earn: partner cards, a reward on approval, credited once */
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth();
      await go('#/apply-earn');
      ok(D.querySelectorAll('.ae-tile').length === 20 && /Axis Bank Credit Card/.test(txt()) && /HSBC Credit Card/.test(txt()) && /SBM Magnet/.test(txt()), 'Apply & Earn lists all 20 partner cards');
      ok(/₹1,300/.test(q('[data-card="axis-bank"]').innerText) && /₹2,300/.test(q('[data-card="hsbc-credit"]').innerText), 'each card shows its reward (60% of the 0-20 payout)');
      var opens3 = []; cw.open = function (url) { opens3.push(url); return { focus: function () {} }; };
      click('[data-card="axis-bank"]');
      ok(await until(function () { return q('.modal [data-yes]'); }) && /you earn ₹1,300/.test(q('.modal').innerText), 'applying says the reward you earn when approved');
      click('.modal [data-yes]'); await sleep(300);
      var pApp = cw.CC.Store.get('applications')[0];
      ok(pApp.cardId === 'axis-bank' && opens3.length === 1 && /axis\.bank\.in\/cards\/credit-card/.test(opens3[0]) && /ref=/.test(opens3[0]), 'the bank opens through Card Crest\u2019s partner link');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      await go('#/admin/applications');
      var sel = q('select[data-app="' + pApp.id + '"]'); sel.value = 'approved'; sel.dispatchEvent(new Event('change', { bubbles: true })); await sleep(300);
      var rew = cw.CC.Store.get('transactions').filter(function (t) { return t.storeId === 'cardreward' && t.offerId === pApp.id; });
      ok(rew.length === 1 && rew[0].cashback === 1300 && rew[0].status === 'confirmed' && rew[0].userId === 'u-001', 'approving the application credits the applicant \u20B91,290');
      sel = q('select[data-app="' + pApp.id + '"]'); sel.value = 'completed'; sel.dispatchEvent(new Event('change', { bubbles: true })); await sleep(300);
      ok(cw.CC.Store.get('transactions').filter(function (t) { return t.storeId === 'cardreward' && t.offerId === pApp.id; }).length === 1, 'a later status change does not pay the reward twice');
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth();
      await go('#/dashboard/transactions');
      ok(/Card approval reward/.test(txt()) && /Axis Bank Credit Card/.test(txt()), 'the reward shows up in the applicant\u2019s Transactions');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();   // back to staff for the tests that follow
      /* the reward is shown on each card, not only on the Apply & Earn page */
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth();
      await go('#/cards');
      async function tileText(id, search) { await go('#/cards?q=' + search); var t = q('[data-card="' + id + '"]'); return t ? t.innerText : null; }
      var hdT = await tileText('hdfc-infinia', 'infinia'), ktT = await tileText('kotak-811', 'kotak'), icT = await tileText('icici-sapphiro', 'sapphiro');
      ok(hdT && /Earn ₹1,300 when approved/.test(hdT), 'an HDFC card tile shows the reward for applying');
      ok(ktT && !/when approved/.test(ktT), 'a card from a bank with no reward shows none');
      ok(icT && /Earn ₹250 when approved/.test(icT), 'a bank with two reward levels shows the lower one (never more than we pay)');
      await go('#/cards/hdfc-infinia');
      ok(!!q('.reward-box') && /₹1,300/.test(q('.reward-box').innerText) && /Apply & Earn ₹1,300/.test(q('[data-apply]').innerText), 'the card page shows the reward and an Apply & Earn button');
      await go('#/cards/kotak-811'); ok(!q('.reward-box') && /Apply for this card/.test(q('[data-apply]').innerText), 'a card with no reward keeps the plain Apply button');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      /* a partner card (Apply & Earn) can be saved and opened without errors */
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth();
      cw.CC.Cards.save('u-001', 'axis-bank');
      await go('#/dashboard/cards');
      ok(cw.location.hash === '#/market/cards', 'My cards now opens My benefit cards');
      await sleep(300); ok(/Saved from the catalog/.test(txt()) && /Axis Bank Credit Card/.test(txt()) && !/NaN/.test(txt()), 'My benefit cards also lists cards saved from the catalog');
      await go('#/cards/axis-bank');
      ok(!/could not load/.test(txt()) && /Earn ₹1,300 when approved/.test(txt()), 'a partner card has a working Benefits page');
      cw.CC.Cards.unsave('u-001', 'axis-bank');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      /* the cardholder's Deal Timeline on an accepted Order & Earn request */
      var MK = cw.CC.Market;
      var sv = await MK.do('saveCard', { bank: 'hdfc', variant: 'Millennia', benefits: [{ kind: 'SHOPPING' }] }, 'u-002');
      var holdCard = MK.cards('u-002')[0];
      var created = await MK.do('create', { module: 'ORDER', details: { url: 'https://www.flipkart.com/p/abc', platform: 'Flipkart', listPrice: 1000, expectedPrice: 900, offerWanted: '10% off on HDFC cards', bank: 'any', address: { name: 'Test Buyer', line: '12 Test Street Area', city: 'Patna', pin: '800004' } } }, 'u-001');
      var dealReq = created && created.request;
      if (dealReq && holdCard) {
        cw.CC.Store.set('session', 'u-001');
        var pd = await MK.pay(dealReq.id);
        ok(pd.ok, 'pay: ' + JSON.stringify(pd));
        var acc = await MK.do('accept', { id: dealReq.id, cardId: holdCard.id }, 'u-002');
        ok(acc.ok, 'accept: ' + JSON.stringify(acc) + ' status ' + MK.request(dealReq.id).status + ' holder ' + MK.request(dealReq.id).cardholderId);
        cw.CC.Store.set('session', 'u-002'); cw.CC.App.paintAuth();
        await go('#/market/r/' + dealReq.id);
        ok(!!q('.deal') && !!q('.deal-timer__t') && /Deal Timeline/.test(txt()), 'the cardholder sees the Deal Timeline with a countdown | ' + txt().slice(0, 160).replace(/s+/g, ' '));
        ok(!!q('.deal-copy [data-copy]') && /Test Buyer/.test(q('.deal').innerText), 'the delivery address has Copy buttons');
        ok(!!q('[data-open-store]') && !!q('[data-exit-deal]'), 'the shop opens in a window and the deal can be exited');
        ok(/Instructions/.test(txt()) && /Payment details/.test(txt()) && /Offer details/.test(txt()) && /Help/.test(txt()), 'instructions, payment details, offer details and FAQs show');
        cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      } else ok(false, 'could not set up an accepted request for the Deal Timeline test: ' + JSON.stringify(created) + JSON.stringify(sv));
      /* names: first letter of every word is a capital */
      var UIc = cw.CC.UI;
      ok(UIc.titleCase('ayush kumar') === 'Ayush Kumar' && UIc.titleCase('BADDY') === 'Baddy' && UIc.titleCase("o'neil mc-donald") === "O'Neil Mc-Donald", 'names get a capital at the start of every word');
      ok(UIc.titleCase('McDonald de Souza') === 'McDonald De Souza' && UIc.titleCase('  a.k.  sharma ') === ' A.K. Sharma ', 'mixed-case words and initials are kept');
      ok(UIc.liftFirstLetters('ayush ku') === 'Ayush Ku', 'typing lifts only the first letters');
      cw.CC.Store.set('session', null); cw.CC.App.paintAuth(); await go('#/signup'); await sleep(200); var sn = q('#s-name'); sn.value = 'ayush kumar'; sn.dispatchEvent(new cw.Event('input', { bubbles: true })); sn.dispatchEvent(new cw.Event('focusout', { bubbles: true }));
      ok(sn.value === 'Ayush Kumar', 'the sign-up name box tidies itself: ' + sn.value);
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      /* the sign-up terms sentence is one line of text, not words spread across the row */
      cw.CC.Store.set('session', null); cw.CC.App.paintAuth(); await go('#/signup'); await sleep(250);
      var tl = q('#s-terms').closest('label'), tlr = tl.getBoundingClientRect(), ta = tl.querySelector('a').getBoundingClientRect();
      ok(ta.left > tlr.left + 100 && Math.abs(tl.querySelector('a').getBoundingClientRect().top - tlr.top) < 40, 'the terms link sits inside the sentence, next to its words');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      /* the "turn on notifications?" card: shown only while the browser permission is still undecided */
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth();
      var perm0 = cw.Notification ? cw.Notification.permission : 'unsupported';
      cw.CC.App.askNotifications(true); await sleep(150);
      if (perm0 === 'default') {
        ok(!!q('#notifAsk [data-allow]') && !!q('#notifAsk [data-later]'), 'a card asks the signed-in user to Allow or say Not now');
        click('#notifAsk [data-later]'); await sleep(100);
        ok(!q('#notifAsk'), 'Not now closes the card');
        cw.CC.App.askNotifications(false); await sleep(100);
        ok(!q('#notifAsk'), 'and it stays away for a while');
      } else ok(!q('#notifAsk'), 'no card when the browser has already decided (' + perm0 + ')');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      await go('#/legal/disclaimer'); ok(/Your data is safe with us/.test(txt()) && /never asks for, or stores, your card number/.test(txt()), 'the disclaimer says the data is safe and how it is protected');
      await go('#/legal/privacy'); ok(/How we protect it/.test(txt()), 'the privacy policy explains how data is protected');
      cw.CC.Store.set('session', 'u-001'); cw.CC.App.paintAuth(); await go('#/market/earn'); await sleep(250);
      ok(!!q('#emailBtn') && /Email me alerts/.test(q('#emailBtn').innerText), 'the Earn page has an "Email me alerts" button');
      click('#emailBtn'); await sleep(300);
      ok(/Email alerts: on/.test(q('#emailBtn').innerText), 'pressing it switches email alerts on');
      click('#emailBtn'); await sleep(300);
      ok(/Email me alerts/.test(q('#emailBtn').innerText), 'pressing it again switches them off');
      cw.CC.Store.set('session', 'u-000'); cw.CC.App.paintAuth();
      /* long tables show one page at a time */
      localStorage.removeItem('cc.pagesize');
      await go('#/admin/stores');
      var nStores = cw.CC.Store.get('stores').length;
      function vis() { return D.querySelectorAll('table.tbl tbody tr:not(.pg-hide)').length; }
      ok(nStores > 10 && vis() === 10, 'the stores list shows 10 rows, not all ' + nStores);
      ok(new RegExp('Showing\\s*1\\u201310\\s*of\\s*' + nStores).test(q('.pager').innerText),'the pager says which rows are showing: ' + q('.pager').innerText.replace(/s+/g, ' '));
      var firstName = q('table.tbl tbody tr:not(.pg-hide) td').innerText;
      click('[data-pg="next"]'); await sleep(100);
      ok(vis() === 10 && q('table.tbl tbody tr:not(.pg-hide) td').innerText !== firstName && /11\u201320/.test(q('.pager').innerText), 'Next shows the following 10');
      click('.pager [data-pg="3"]'); await sleep(100);
      ok(vis() === nStores - 20 && new RegExp('21\\u2013' + nStores).test(q('.pager').innerText), 'the last page shows what is left');
      var sel = q('.pager select'); sel.value = '25'; sel.dispatchEvent(new Event('change', { bubbles: true })); await sleep(100);
      ok(vis() === nStores && !q('[data-pg="next"]'), 'choosing 25 rows per page shows them all');
      sel = q('.pager select'); sel.value = '10'; sel.dispatchEvent(new Event('change', { bubbles: true })); await sleep(100);
      set('[data-filter]', 'ama'); await sleep(700);
      ok(vis() === 1 && q('.pager').hidden, 'a search narrows the list and the pager steps aside');
      localStorage.removeItem('cc.pagesize');

      ok(errs.length === 0, 'no console or script errors' + (errs.length ? ': ' + errs.slice(0, 3).join(' | ') : ''));
    } catch (e) { bad++; log('bad', 'FAIL  harness crashed: ' + e.message + '\n' + (e.stack || '')); }
    log(bad ? 'bad' : 'ok', '\n' + pass + ' passed, ' + bad + ' failed');
    document.title = 'DONE ' + pass + ' passed ' + bad + ' failed';
  };
  f.src = '../index.html?demo=1#/market';
})();
