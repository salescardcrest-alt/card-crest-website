<title>Joining Card Crest</title>
<script>
/* A friend's link such as /join?ref=CC-RAVI-1A2B lands here and goes straight on to the site's home page,
   which opens sign up with the code filled in. A real file is needed because the host has no catch-all route. */
var home = location.pathname.replace(/\/join\/?$/, '/');
location.replace(home + location.search + location.hash);
</script>
